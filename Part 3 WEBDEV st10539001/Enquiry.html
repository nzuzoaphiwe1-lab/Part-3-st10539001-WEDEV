    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--header section-->
    <header class="site-header">
        <!--div class "top brand"-->
        <div class="top-brand">

            <a href="Index.html" class="brand-link">
                <!--img "logo"-->
                <img src="LOGO.png" alt="CARs RS logo" class="mini-logo">
                <span>CARs RS</span>
            </a>

        </div>
        <!--navigation list-->
        <nav class="main-nav">
            <ul>
                <li><a href="Index.html">Home</a></li>
                <li><a href="vehicles.html">Available cars</a></li>
                <li><a href="Contact.html">Contact</a></li>

        </nav>

<!--end of header-->

<!--main content section-->
    <main class="page-content">
<!--enquiry form section-->
        <h1 class="headings">Enquiry</h1>
<!--section id="enquiry"-->
        <section id="enquiry">

            <h3>Enquiry Form</h3>

            <p>If you have any questions or would like to make an enquiry, please fill out the form below and we will get back to you as soon as possible.</p>
<!--form-->
            <form class="enquiry-form">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name">

                <label for="age">Age</label>
                <input type="number" id="age" name="age" placeholder="Your age">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your email">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Your enquiry"></textarea>

                <button type="submit" id="SB">Submit</button>
                
            </form>
<!--end form-->
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
